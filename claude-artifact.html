<title>แสงเช้า</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap">
<style>
/* Layout: a chat with Grandma Somsri at home. Top: her living room in morning light, with her changing clothes and pose to match how you feel.
   Below: the chat, quick replies, and a text box. Warm single light look by design. */
:root {
  color-scheme: light;
  --wall: #fbf1e2;
  --wall-2: #f4e2c9;
  --floor: #d9b48a;
  --paper: #ffffff;
  --cream: #fffaf2;
  --ink: #33251f;
  --ink-soft: #7b6a60;
  --ink-faint: #ad9e94;
  --line: #eadfd2;
  --accent: #c8643b;
  --honey: #e9b44c;
  --mood: #f6e1c8;
  --f: "Kanit", "Sukhumvit Set", "Noto Sans Thai", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--f); font-weight: 300; font-size: 16px; line-height: 1.55; overflow: hidden; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2.5px solid var(--honey); outline-offset: 2px; }

.stage { height: 100%; display: flex; justify-content: center; }
.app { width: 100%; max-width: 460px; height: 100%; display: flex; flex-direction: column; background: var(--cream); position: relative; overflow: hidden; }
@media (min-width: 620px) {
  body { background: #efe6da; }
  .stage { align-items: center; padding-block: 28px; }
  .app { height: min(860px, 100%); border-radius: 36px; box-shadow: 0 40px 80px -40px rgba(60, 35, 20, .45); }
}

/* Header */
.head { display: flex; align-items: center; gap: .7rem; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: var(--cream); border-bottom: 1px solid var(--line); z-index: 2; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--mood); overflow: hidden; flex: none; display: grid; place-items: end center; transition: background .5s; }
.avatar svg { width: 46px; height: auto; margin-bottom: -26px; }
.who { flex: 1; min-width: 0; line-height: 1.25; }
.who b { font-weight: 500; font-size: 1.02rem; display: block; }
.who small { font-size: .78rem; color: var(--ink-soft); display: flex; align-items: center; gap: .35rem; }
.who small i { width: 7px; height: 7px; border-radius: 50%; background: #5cae78; }
.streak { font-size: .78rem; color: var(--ink-soft); background: #f4ebdf; border-radius: 999px; padding: .2rem .65rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.streak b { color: var(--ink); font-weight: 500; }

/* Living room */
.scene { position: relative; flex: none; height: clamp(210px, 34vh, 290px); overflow: hidden; background: linear-gradient(180deg, var(--wall) 0%, var(--wall-2) 100%); }
.scene::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: repeating-linear-gradient(90deg, #d4ab7f 0 58px, #cfa476 58px 60px), var(--floor); border-top: 3px solid #c39566; }
.window { position: absolute; top: 14%; right: 9%; width: 30%; max-width: 130px; aspect-ratio: 4 / 5; border-radius: 10px 10px 4px 4px; border: 5px solid #fff; box-shadow: 0 0 0 1.5px #d9c3a6, 0 0 60px 10px rgba(255, 220, 150, .55);
  background: radial-gradient(circle at 70% 30%, #fff6c9 0 12%, #ffe08f 13% 18%, transparent 19%), linear-gradient(180deg, #bfe3f6 0%, #e9f5fb 70%, #cde8c4 70%); }
.window::before, .window::after { content: ""; position: absolute; background: #fff; }
.window::before { left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; }
.window::after { top: 50%; left: 0; right: 0; height: 4px; margin-top: -2px; }
.calendar { position: absolute; top: 16%; left: 9%; width: 46px; background: #fff; border-radius: 4px; box-shadow: 0 2px 0 #e4d3bd; text-align: center; font-size: .62rem; line-height: 1.2; color: var(--ink-soft); padding-bottom: 4px; }
.calendar b { display: block; background: var(--accent); color: #fff; font-weight: 500; border-radius: 4px 4px 0 0; padding: 2px 0; font-size: .58rem; }
.calendar span { display: block; font-size: 1.15rem; color: var(--ink); font-weight: 500; }
.plant { position: absolute; left: 6%; bottom: 14%; width: 17%; max-width: 70px; }
.glow { position: absolute; left: 50%; bottom: 10%; width: 62%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle, var(--mood) 0 55%, transparent 70%); transition: background .6s; }
.grandma { position: absolute; left: 50%; bottom: 6%; height: 88%; transform: translateX(-50%); z-index: 1; }
.grandma svg { height: 100%; width: auto; display: block; overflow: visible; }
.grandma.swap svg { animation: swap .5s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes swap { from { transform: scale(.9) translateY(8px); opacity: .3; } to { transform: none; opacity: 1; } }
.hearts { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.heart { position: absolute; width: 20px; height: 20px; animation: float 1.9s ease-out forwards; }
@keyframes float { from { opacity: 0; transform: translateY(0) scale(.6); } 15% { opacity: 1; } to { opacity: 0; transform: translateY(-150px) scale(1.1); } }

/* Chat */
.log { flex: 1; min-height: 0; overflow-y: auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth; }
.day-chip { align-self: center; font-size: .74rem; color: var(--ink-faint); background: #f4ebdf; border-radius: 999px; padding: .1rem .7rem; margin-bottom: 4px; }
.msg { max-width: 82%; padding: .55rem .9rem; border-radius: 20px; font-size: .98rem; font-weight: 400; overflow-wrap: anywhere; animation: in .3s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.msg.g { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg.u { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 6px; font-weight: 300; }
.msg.quote { font-weight: 500; font-size: 1.05rem; background: #fff6e3; border-color: #f1ddb3; }
.typing { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; border-bottom-left-radius: 6px; padding: .7rem .9rem; display: flex; gap: 4px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); animation: dot 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

/* Composer */
.composer { flex: none; border-top: 1px solid var(--line); background: var(--cream); padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; }
.replies { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.reply { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; min-height: 40px; padding: 0 .95rem; font-size: .9rem; font-weight: 400; display: inline-flex; align-items: center; gap: .4rem; transition: border-color .2s, transform .1s; }
.reply:hover { border-color: #cdb9a4; }
.reply:active { transform: scale(.97); }
.reply .dot { width: 10px; height: 10px; border-radius: 50%; }
.reply.main { background: var(--ink); color: #fff; border-color: var(--ink); }
.inputrow { display: flex; gap: 8px; align-items: center; }
.inputrow input { flex: 1; min-width: 0; min-height: 46px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); padding: 0 1rem; font: inherit; font-weight: 400; color: var(--ink); }
.inputrow input::placeholder { color: var(--ink-faint); font-weight: 300; }
.send { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; display: grid; place-items: center; flex: none; padding: 0; }
.send:disabled { background: var(--line); }
.send svg { width: 20px; height: 20px; }
.hold { position: relative; overflow: hidden; min-height: 58px; border-radius: 999px; border: 0; background: #f1e6d8; font-size: 1rem; font-weight: 400;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; display: flex; align-items: center; justify-content: center; padding: 0 64px; }
.hold .fill { position: absolute; inset: 0; width: 0; background: var(--accent); border-radius: 999px; }
.hold .label { position: relative; z-index: 1; }
.hold .knob { position: absolute; right: 6px; top: 6px; width: 46px; height: 46px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; z-index: 2; }
.hold .knob svg { width: 22px; height: 22px; }

/* Share sheet */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(40, 25, 15, .45); }
.sheet-panel { width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto; background: var(--cream); border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: .85rem;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 1rem calc(1.25rem + env(safe-area-inset-bottom, 0px)); animation: up .32s cubic-bezier(.2, .8, .2, 1); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h2 { margin: 0; font-size: 1.05rem; font-weight: 500; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: #f1e6d8; display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 18px; height: 18px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: #f1e6d8; border-radius: 999px; }
.seg button { border: 0; background: transparent; min-height: 38px; border-radius: 999px; font-size: .88rem; color: var(--ink-soft); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 500; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.preview { display: flex; justify-content: center; }
.preview img { width: min(56vw, 220px); aspect-ratio: 9 / 16; max-width: 100%; border-radius: 18px; background: #f1e6d8; box-shadow: 0 18px 40px -18px rgba(60, 35, 20, .5); -webkit-touch-callout: default; transition: opacity .2s; }
.pill { min-height: 54px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font-size: 1rem; font-weight: 400; display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: 0 1.4rem; }
.pill svg { width: 20px; height: 20px; }
.how-title { margin: 0 0 -.4rem; font-size: .85rem; font-weight: 500; }
.how { margin: 0; padding: .85rem 1rem .85rem 2.1rem; background: #f4ebdf; border-radius: 18px; font-size: .88rem; color: var(--ink-soft); display: flex; flex-direction: column; gap: .25rem; }
.how b { color: var(--ink); font-weight: 500; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.row2 button { border: 0; background: #f1e6d8; border-radius: 999px; min-height: 44px; font-size: .9rem; }

.toast { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: .5rem 1.05rem; border-radius: 999px; font-size: .88rem; z-index: 30; max-width: calc(100% - 32px); text-align: center; }

/* Grandma motion */
.gm-body { transform-origin: 100px 240px; animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.012, .993); } }
.gm-wave { transform-box: fill-box; transform-origin: 0% 100%; animation: wave 1.6s ease-in-out infinite; }
@keyframes wave { 50% { transform: rotate(-14deg); } }
.gm-fan { transform-origin: 148px 92px; animation: fan .5s ease-in-out infinite alternate; }
@keyframes fan { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
.gm-steam { animation: steam 2.4s ease-in-out infinite; }
@keyframes steam { 0%, 100% { opacity: .15; transform: translateY(2px); } 50% { opacity: .7; transform: translateY(-3px); } }
.gm-spark { transform-box: fill-box; transform-origin: center; animation: spark 1.4s ease-in-out infinite; }
@keyframes spark { 50% { transform: scale(.55); opacity: .5; } }
.gm-blink { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.15); } }

@media (max-height: 640px) { .scene { height: 190px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .log { scroll-behavior: auto; } }
</style>

<div class="stage">

/* ---------- State ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("sc:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("sc:" + k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const now = new Date();
const dayKey = d => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
const today = dayKey(now);
const dayNum = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 864e5) + now.getFullYear() * 366;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }

$("calDay").textContent = now.getDate();
$("calMonth").textContent = now.toLocaleDateString("th-TH", { month: "short" });
let visits = store.get("visits", []);
if (!visits.includes(today)) { visits.push(today); visits = visits.slice(-60); store.set("visits", visits); }
let streak = 0; { const c = new Date(now); while (visits.includes(dayKey(c))) { streak++; c.setDate(c.getDate() - 1); } }
$("streak").innerHTML = streak > 1 ? `มาหายาย <b>${streak}</b> วันติด` : "เช้าแรกที่บ้านยาย";

let data = (() => { const d = store.get("chat", {}); return d.day === today ? d : { day: today, log: [] }; })();
if (data.mood && !MOODS[data.mood]) delete data.mood;
const save = () => { data.log = data.log.slice(-60); store.set("chat", data); };
const M = () => MOODS[data.mood] || null;

/* ---------- Grandma on stage ---------- */
let look = { outfit: "home", pose: "wave", face: "smile" };
function setLook(next) {
  look = { ...look, ...next };
  const el = $("grandma"); el.innerHTML = grandmaSVG(look); el.classList.remove("swap"); void el.offsetWidth; el.classList.add("swap");
  $("avatar").innerHTML = grandmaSVG({ ...look, pose: "rest" }, false);

}
const moodLook = () => M() ? { outfit: M().outfit, pose: M().pose, face: M().face } : { outfit: "home", pose: "rest", face: "gentle" };
function hearts() {
  if (reduced) return;
  for (let i = 0; i < 10; i++) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "-11 -10 22 20"); s.setAttribute("class", "heart");
    s.innerHTML = `<path d="M0 6C-7 1-10-3-10-7a5 5 0 0 1 10-2 5 5 0 0 1 10 2c0 4-3 8-10 13z" fill="${i % 3 ? ROSE : GOLD}"/>`;
    s.style.left = (32 + Math.random() * 36) + "%"; s.style.top = (40 + Math.random() * 30) + "%"; s.style.animationDelay = (i * .12) + "s";
    $("hearts").appendChild(s); setTimeout(() => s.remove(), 2800);
  }
  if (navigator.vibrate) try { navigator.vibrate(40); } catch (e) {}
}

/* ---------- Chat ---------- */
function bubble(m) {
  const d = document.createElement("div");
  d.className = "msg " + m.who + (m.quote ? " quote" : "");
  d.textContent = m.text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}
function add(who, text, extra = {}) { const m = { who, text, ...extra }; data.log.push(m); save(); bubble(m); }
let busy = false;
async function say(text, extra) {
  const t = document.createElement("div"); t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>";
  $("log").appendChild(t); $("log").scrollTop = $("log").scrollHeight;
  await wait(reduced ? 200 : Math.min(1600, 450 + text.length * 16));
  t.remove(); add("g", text, extra);
}
const user = text => add("u", text);

/* Quick replies for each step of the morning */
function setStep(step) { data.step = step; save(); renderReplies(); }
function chip(label, fn, opts = {}) {
  const b = document.createElement("button"); b.type = "button"; b.className = "reply" + (opts.main ? " main" : "");
  if (opts.dot) b.innerHTML = `<span class="dot" style="background:${opts.dot}"></span>`;
  b.append(label);
  b.onclick = async () => { if (busy) return; busy = true; $("replies").innerHTML = ""; try { await fn(); } finally { busy = false; renderReplies(); } };
  return b;
}
function renderReplies() {
  const box = $("replies"); box.innerHTML = "";
  if (busy) return;
  const s = data.step;
  if (s === "mood") Object.entries(MOODS).forEach(([k, m]) => box.append(chip(m.label, () => pickMood(k), { dot: m.color })));
  if (s === "cheer") {
    box.append(chip("ยายพูดอีกหน่อย", moreWords), chip("ส่งคำยายลงสตอรี่", openShare), chip("ขอบคุณนะยาย", thanks, { main: true }));
  }
  if (s === "promise") {
    (M() ? M().ideas : MOODS.lonely.ideas).forEach(t => box.append(chip(t, () => makePromise(t))));
    box.append(chip("ไว้ค่อยคิดนะยาย", skipPromise));
  }
  if (s === "hug") box.append(holdButton());
  if (s === "done") box.append(chip("ไปแล้วนะยาย", leave, { main: true }), chip("ส่งคำยายลงสตอรี่", openShare));
  if (s === "after") {
    if (data.promise && !data.done) box.append(chip("ทำตามที่สัญญาแล้วยาย", keptPromise, { main: true }));
    box.append(chip("อยากเล่าให้ยายฟังอีก", askMood), chip("ส่งคำยายลงสตอรี่", openShare));
  }
}

/* Script */
// Pick a line grandma hasn't used lately. Remembers what she said across days; starts over only when every line has been used.
function fresh(key, arr) {
  let used = store.get("used:" + key, []).filter(i => i < arr.length);
  if (used.length >= arr.length) used = used.slice(-1);
  const pool = arr.map((_, i) => i).filter(i => !used.includes(i));
  const i = pool[Math.floor(Math.random() * pool.length)];
  used.push(i); store.set("used:" + key, used);
  return arr[i];
}
function todaysQuote() {
  if (!data.dailyQuote) { data.dailyQuote = fresh("quotes", QUOTES); save(); }
  return data.dailyQuote;
}
async function greet() {
  const h = now.getHours();
  const slot = h < 5 ? "late" : h < 11 ? "morning" : h < 17 ? "noon" : h < 22 ? "evening" : "late";
  busy = true;
  setLook({ outfit: "home", pose: "wave", face: "smile" });
  for (const l of fresh("greet-" + slot, LINES[slot])) await say(l);

/* Hold to hug */
function holdButton() {
  const b = document.createElement("button");
  b.type = "button"; b.className = "hold"; b.setAttribute("aria-label", "กดค้างไว้เพื่อกอดยาย");
  b.innerHTML = `<span class="fill"></span><span class="label">กดค้างไว้ กอดยาย</span><span class="knob" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></span>`;
  const fill = b.querySelector(".fill"); let start = 0, raf = 0, done = false;
  const tick = () => {
    const p = Math.min(1, (performance.now() - start) / 1300); fill.style.width = p * 100 + "%";
    if (p >= 1 && !done) { done = true; busy = true; $("replies").innerHTML = ""; hugged().finally(() => { busy = false; renderReplies(); }); return; }
    raf = requestAnimationFrame(tick);
  };
  const begin = e => { if (e) e.preventDefault(); if (done) return; cancelAnimationFrame(raf); start = performance.now(); raf = requestAnimationFrame(tick); };
  const end = () => { cancelAnimationFrame(raf); if (!done) fill.style.width = "0"; };
  b.addEventListener("pointerdown", begin);
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, end));
  b.addEventListener("contextmenu", e => e.preventDefault());
  b.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && !e.repeat) { e.preventDefault(); begin(); } });
  b.addEventListener("keyup", e => { if (e.key === "Enter" || e.key === " ") end(); });
  return b;
}

/* ---------- Story card (1080 × 1920) ---------- */
function thaiWords(text) {
  if (window.Intl && Intl.Segmenter) return Array.from(new Intl.Segmenter("th", { granularity: "word" }).segment(text), s => s.segment);
  return Array.from(text);
}
// Thai has no spaces between words, but a space marks a phrase break: keep phrases whole, split a phrase only if it alone is too wide
function wrapLines(ctx, text, maxW) {
  const lines = []; let line = "";
  const tokens = text.split(/(?<= )/).flatMap(p => ctx.measureText(p.trim()).width > maxW ? thaiWords(p) : [p]);
  for (const w of tokens) {
    const test = line + w;
    if (ctx.measureText(test).width > maxW && line.trim()) { lines.push(line.trim()); line = w.trimStart(); } else line = test;
  }
  if (line.trim()) lines.push(line.trim());
  return lines;
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function loadSVG(svg) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); }); }
const currentQuote = () => data.quote || todaysQuote();

async function makeStory(text, platform) {
  try { await Promise.all(["300 40px Kanit", "400 60px Kanit", "500 80px Kanit"].map(f => document.fonts.load(f))); } catch (e) {}
  const P = PLATFORMS[platform], W = 1080, H = 1920, F = '"Kanit", "Sukhumvit Set", sans-serif';
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d"), m = M();
  const X = 90, right = W - P.right, cx = (X + right) / 2, maxW = right - X;

  // Wall, window light, floor
  const wall = ctx.createLinearGradient(0, 0, 0, H); wall.addColorStop(0, "#fbf1e2"); wall.addColorStop(1, "#f1dcbf");
  ctx.fillStyle = wall; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W - 220, P.top + 120, 0, W - 220, P.top + 120, 520);
  glow.addColorStop(0, "rgba(255,226,150,.75)"); glow.addColorStop(1, "rgba(255,226,150,0)"); ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  const floorY = H - P.bottom - 380;
  ctx.fillStyle = "#d9b48a"; ctx.fillRect(0, floorY, W, H - floorY);
  ctx.fillStyle = "#c39566"; ctx.fillRect(0, floorY, W, 8);
  ctx.fillStyle = "rgba(0,0,0,.05)"; for (let x = 0; x < W; x += 150) ctx.fillRect(x, floorY + 8, 4, H);

  // Eyebrow
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.font = `400 38px ${F}`; ctx.fillStyle = "#7b6a60";
  ctx.fillText(m ? `ยายสมศรีฝากมา ตอนหลาน${m.label}` : "ยายสมศรีฝากมาบอก", cx, P.top + 60);

  // Grandma standing on the floor
  const GH = 640, GW = GH * 200 / 250, gTop = floorY + 120 - GH;
  const gm = m ? { outfit: m.outfit, pose: m.pose, face: m.face } : { outfit: "home", pose: "hug", face: "gentle" };
  ctx.fillStyle = m ? m.glow : "#f6e1c8"; ctx.beginPath(); ctx.arc(cx, gTop + GH * .45, GW * .55, 0, Math.PI * 2); ctx.fill();
  try { const img = await loadSVG(grandmaSVG(gm, false)); ctx.drawImage(img, cx - GW / 2, gTop, GW, GH); } catch (e) {}

  // Speech bubble with the quote
  const bTop = P.top + 100, bBottom = gTop - 30, bw = maxW, bx = X;
  let size = 76, lines;
  do { ctx.font = `500 ${size}px ${F}`; lines = wrapLines(ctx, text, bw - 120); size -= 4; } while (lines.length * size * 1.45 + 120 > bBottom - bTop && size > 44);
  size += 4; const lh = size * 1.45, bh = Math.min(bBottom - bTop, lines.length * lh + 110), by = bTop + (bBottom - bTop - bh) / 2;
  ctx.save(); ctx.shadowColor = "rgba(80,50,30,.14)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14;
  roundRect(ctx, bx, by, bw, bh, 56); ctx.fillStyle = "#ffffff"; ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx - 34, by + bh - 2); ctx.lineTo(cx, by + bh + 46); ctx.lineTo(cx + 34, by + bh - 2); ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.font = `500 ${size}px ${F}`; ctx.fillStyle = "#33251f";
  lines.forEach((l, i) => ctx.fillText(l, cx, by + 55 + size * .95 + i * lh));

  // QR panel
  ctx.textAlign = "left";
  const ph = 180, pw = Math.min(maxW, 560), px = cx - pw / 2, py = H - P.bottom - ph;
  ctx.save(); ctx.shadowColor = "rgba(80,50,30,.18)"; ctx.shadowBlur = 36; ctx.shadowOffsetY = 10;
  roundRect(ctx, px, py, pw, ph, 44); ctx.fillStyle = "#fffaf2"; ctx.fill(); ctx.restore();
  const qs = 136, qx = px + 22, qy = py + (ph - qs) / 2;
  if (window.qrcode) {
    const qr = qrcode(0, "M"); qr.addData(APP_URL); qr.make();
    const n = qr.getModuleCount(), cell = qs / n; ctx.fillStyle = "#33251f";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect(qx + c * cell, qy + r * cell, Math.ceil(cell), Math.ceil(cell));
  }
  const tx = qx + qs + 28;
  ctx.fillStyle = "#33251f"; ctx.font = `500 38px ${F}`; ctx.fillText("คุยกับยายสมศรี", tx, py + 76);
  ctx.font = `300 28px ${F}`; ctx.fillStyle = "#7b6a60";
  ctx.fillText("สแกนให้ยายกอด", tx, py + 118);
  ctx.fillText("ทุกเช้าที่แสงเช้า", tx, py + 154);
  return cv.toDataURL("image/png");
}
